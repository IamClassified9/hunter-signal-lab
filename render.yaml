services:
  # Backend API (FastAPI). Frankfurt: some exchanges block US servers.
  - type: web
    name: hunter-signal-lab-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HUNTER_EXCHANGE
        value: binance
      - key: HUNTER_SYMBOLS
        value: BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT,DOGE/USDT
      - key: HUNTER_CACHE_TTL
        value: "15"
      # Set to your frontend URL after it is deployed, e.g. https://hunter-signal-lab-web.onrender.com
      - key: HUNTER_CORS_ORIGINS
        sync: false

  # Frontend (static React build).
  - type: web
    name: hunter-signal-lab-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Set to your backend URL (no trailing slash), then redeploy: it is baked in at build time.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
